<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Семейная стоматология — Электроугли</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#fff}*{box-sizing:border-box}body{margin:0}a{color:inherit}.site-header{width:calc(100% - 48px);max-width:1828px;margin:100px auto 0;background:#23845c}.header-inner{min-height:94px;max-width:1400px;margin:auto;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:15px;min-width:350px;text-decoration:none}.brand-mark{width:51px;height:51px;border-radius:50%;background:#fff;color:#23845c;display:grid;place-items:center;flex:none}.brand-mark svg{width:37px;height:37px}.brand-name{font-size:23px;line-height:1.02;letter-spacing:.1px}.hours,.socials,.phones,.callback{min-height:76px;display:flex;align-items:center;border-right:1px solid #ffffff2d}.hours{font-size:20px;line-height:1.7;min-width:268px}.socials{gap:18px;padding:0 26px;min-width:225px}.socials a,.socials span{width:40px;height:40px;background:#fff;border-radius:50%;display:grid;place-items:center;color:#23845c;text-decoration:none;font-weight:800;font-size:17px}.socials span:first-child{border-radius:8px;font-size:16px;letter-spacing:-2px}.socials svg{width:23px;height:23px}.phones{display:block;padding:17px 33px;min-width:276px;font-size:20px;line-height:1.5;font-weight:600;white-space:nowrap}.phones a{display:block;text-decoration:none}.callback{border:0;padding-left:31px;font-size:20px;white-space:nowrap}.callback a:hover,.phones a:hover{text-decoration:underline}.menu-button{display:none;background:none;border:0;color:#fff;cursor:pointer;padding:10px}.menu-button svg{display:block;width:28px}.mobile-panel{display:none}
    @media(max-width:1450px){.header-inner{padding:0 24px}.brand{min-width:280px}.brand-name{font-size:20px}.hours{min-width:235px;font-size:17px}.socials{min-width:185px;gap:12px;padding:0 16px}.phones{min-width:240px;font-size:17px;padding:20px}.callback{font-size:17px;padding-left:20px}}
    @media(max-width:1080px){.site-header{margin-top:30px}.header-inner{flex-wrap:wrap;justify-content:space-between;padding:12px 22px;gap:12px}.brand,.hours,.socials,.phones,.callback{min-width:auto;min-height:auto;border:0}.brand{margin-right:auto}.hours{order:3;width:100%;font-size:15px}.socials{padding:0}.phones{padding:0;font-size:15px}.callback{padding:0;font-size:15px}}
    @media(max-width:680px){.site-header{width:100%;margin-top:0}.header-inner{min-height:78px;padding:12px 18px}.brand-mark{width:44px;height:44px}.brand-name{font-size:18px}.brand{gap:10px}.menu-button{display:block}.hours,.socials,.phones,.callback{display:none}.mobile-panel.open{display:flex;flex-direction:column;gap:18px;padding:0 20px 22px}.mobile-panel .hours,.mobile-panel .socials,.mobile-panel .phones,.mobile-panel .callback{display:flex;width:auto;font-size:16px;padding:0;order:initial}.mobile-panel .phones{display:block}.mobile-panel .callback{display:block}.mobile-panel .socials{gap:12px}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="Семейная стоматология — главная">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="7" r="3.5" fill="currentColor"/><path d="M9 14c3-2 7-1 11 2 4-3 8-4 11-2 3 2 2 6 0 10-2 4-3 9-6 9-2 0-2-4-5-7-3 3-3 7-5 7-3 0-4-5-6-9-2-4-3-8 0-10Z" fill="currentColor"/><path d="M20 17v8" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        <span class="brand-name">Семейная<br>Стоматология</span>
      </a>
      <div class="hours">Пн. – Пт.: с 8:00 - 20:00<br>Сб. – Вс.: с 9:00 - 20:00</div>
      <div class="socials" aria-label="Мессенджеры">
        <span aria-label="ВКонтакте">VK</span>
        <span aria-label="Telegram"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.8 3.6 18.4 20c-.2 1.1-.8 1.4-1.6.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1L18 6.5c.4-.4-.1-.6-.6-.3L6 13.4l-4.9-1.5c-1.1-.4-1.1-1.1.2-1.6L20.4 3c.9-.3 1.7.2 1.4.6Z"/></svg></span>
        <a href="https://wa.me/79255058819" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11.8a8.5 8.5 0 0 1-12.4 7.5L3 20.7l1.4-4.9a8.5 8.5 0 1 1 16.1-4Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 7.8c-.6.5-.7 1.3-.5 2.1.8 2.5 3.3 5 5.9 5.8.8.2 1.6.1 2.1-.5l.5-.7-2.2-1.2-.8.9a7.2 7.2 0 0 1-3.3-3.3l.9-.8-1.2-2.2-.7-.1Z" fill="currentColor"/></svg></a>
      </div>
      <div class="phones"><a href="tel:+74951208006">+7 (495) 120-80-06</a><a href="tel:+79255058819">+7 (925) 505-88-19</a></div>
      <div class="callback"><a href="tel:+74951208006">Заказать обратный звонок</a></div>
      <button class="menu-button" type="button" aria-label="Открыть контакты" aria-expanded="false" aria-controls="mobile-panel"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="mobile-panel" id="mobile-panel"></div>
  </header>
  <script>
    const button = document.querySelector('.menu-button');
    const panel = document.querySelector('.mobile-panel');
    const desktop = document.querySelector('.header-inner');
    const items = ['.hours','.socials','.phones','.callback'].map(selector => desktop.querySelector(selector));
    const media = window.matchMedia('(max-width: 680px)');
    function placeItems() {
      if (media.matches) items.forEach(item => panel.append(item));
      else {
        items.forEach(item => desktop.insertBefore(item, button));
        panel.classList.remove('open');
        button.setAttribute('aria-expanded', 'false');
      }
    }
    placeItems();
    media.addEventListener('change', placeItems);
    button.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      button.setAttribute('aria-expanded', String(open));
      button.setAttribute('aria-label', open ? 'Закрыть контакты' : 'Открыть контакты');
    });
  </script>
</body>
</html>
